[project]
name = "fastapi-edge-gateway-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.26.0",
]

[pytest]
asyncio_mode = "auto"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
